name: afterglow
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: afterglow
      POSTGRES_PASSWORD: afterglow_dev
      POSTGRES_DB: afterglow
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U afterglow -d afterglow']
      interval: 5s
      timeout: 5s
      retries: 20
  storage:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-afterglow_local}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-afterglow_local_storage_only}
      RUSTFS_CONSOLE_ENABLE: 'true'
    command: ['/data']
    ports:
      - '9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - storage-data:/data
volumes:
  postgres-data:
  storage-data:
